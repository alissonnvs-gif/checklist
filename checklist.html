  /* =========================================================
     SERVIDOR (Supabase) — conta, login e sincronismo
     Agora sincroniza TUDO: abas, tarefas, horários, o histórico semanal de
     marcações, o nome e o tema. A cópia local continua existindo e é o que a
     tela lê — o app abre e funciona sem internet, e envia quando ela voltar.
     ========================================================= */

  // Se a biblioteca do servidor não carregou (primeira abertura sem internet),
  // avisa em vez de deixar a tela em branco.
  if (!window.supabase || !window.supabase.createClient) {
    document.querySelector(".page").style.display = "none";
    document.getElementById("authwrap").hidden = false;
    document.getElementById("authSub").textContent =
      "Não deu para carregar o servidor. Confira a internet e abra o app de novo.";
    document.getElementById("authForm").style.display = "none";
    document.getElementById("authSwitch").style.display = "none";
    return;
  }

  var sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
  });

  var currentUser = null;

  /* ---------- o que o servidor deveria ter, a partir do estado local ---------- */

  function desiredRows() {
    var rows = { profile: null, cats: {}, tasks: {}, checks: {} };
    rows.profile = { display_name: state.userName || "", theme: state.theme || null };

    cats().forEach(function (c, i) {
      rows.cats[c.id] = { id: c.id, label: c.label, palette: c.palette, sort_order: i };
    });

    cats().forEach(function (c) {
      var bucket = state[c.id];
      if (!bucket) return;

      bucket.schedule.forEach(function (it) {
        rows.tasks[it.id] = {
          id: it.id, category_id: c.id, kind: "schedule",
          title: it.title || "", note: it.note || "",
          days: (it.days || []).slice().sort(function (a, b) { return a - b; }),
          due_date: null, time_of_day: it.time || "", done: false,
          // Mandamos a data de criação de propósito em vez de deixar o banco
          // carimbar a dele: é por ela que a lista é ordenada, e um lote
          // enviado de uma vez receberia todos o mesmo carimbo, embaralhando
          // a ordem das tarefas na próxima abertura.
          created_at: new Date(it.createdAt || Date.now()).toISOString()
        };
        var dm = it.doneMap || {};
        Object.keys(dm).forEach(function (monday) {
          Object.keys(dm[monday]).forEach(function (wd) {
            if (!dm[monday][wd]) return;
            rows.checks[it.id + "|" + monday + "|" + wd] =
              { task_id: it.id, week_monday: monday, weekday: Number(wd) };
          });
        });
      });

      bucket.projects.forEach(function (t) {
        rows.tasks[t.id] = {
          id: t.id, category_id: c.id, kind: "once",
          title: t.text || "", note: "", days: [],
          due_date: t.date || null, time_of_day: t.time || "", done: !!t.done,
          created_at: new Date(t.createdAt || Date.now()).toISOString()
        };
      });
    });

    return rows;
  }

  function fpOf(o) { return JSON.stringify(o); }

  function sameFps(want, have, direto) {
    var a = Object.keys(want), b = Object.keys(have);
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) {
      if (!(a[i] in have)) return false;
      if (!direto && have[a[i]] !== fpOf(want[a[i]])) return false;
    }
    return true;
  }

  // Registra que o servidor está em dia com o que temos aqui.
  function markServerClean() {
    var want = desiredRows();
    var srv = { profile: fpOf(want.profile), cats: {}, tasks: {}, checks: {} };
    Object.keys(want.cats).forEach(function (id) { srv.cats[id] = fpOf(want.cats[id]); });
    Object.keys(want.tasks).forEach(function (id) { srv.tasks[id] = fpOf(want.tasks[id]); });
    Object.keys(want.checks).forEach(function (k) { srv.checks[k] = 1; });
    state.srv = srv;
    localDirty = false;
  }

  // Registra que o servidor não tem nada nosso — tudo precisa subir.
  function markServerEmpty() {
    state.srv = { profile: null, cats: {}, tasks: {}, checks: {} };
    localDirty = true;
  }

  /* ---------- envio ---------- */

  var pushTimer = null;
  var pushing = false;
  var pushQueued = false;

  function schedulePush() {
    if (!currentUser) return;
    window.clearTimeout(pushTimer);
    pushTimer = window.setTimeout(runPush, 800);
  }

  async function runPush() {
    if (!currentUser || pushing) { if (pushing) pushQueued = true; return; }
    pushing = true;
    try {
      await pushOnce();
      localDirty = false;
      persistQuiet();
    } catch (e) {
      // Sem internet ou erro do servidor: a cópia local continua válida e o
      // que ficou pendente sobe na próxima tentativa. Nada se perde.
      persistQuiet();
    }
    pushing = false;
    if (pushQueued) { pushQueued = false; schedulePush(); }
  }

  // A ordem importa por causa das ligações entre as tabelas: a tarefa aponta
  // para a aba e a marcação aponta para a tarefa. Criar segue aba → tarefa →
  // marcação; apagar segue o caminho inverso.
  async function pushOnce() {
    var uidv = currentUser.id;
    var want = desiredRows();
    var srv = state.srv;

    function owned(o) {
      var copy = Object.assign({}, o);
      copy.user_id = uidv;
      return copy;
    }
    function fail(r) { if (r && r.error) throw r.error; return r; }

    // 1. perfil (nome e tema)
    var pfp = fpOf(want.profile);
    if (srv.profile !== pfp) {
      fail(await sb.from("profiles").upsert({
        id: uidv, display_name: want.profile.display_name, theme: want.profile.theme
      }));
      srv.profile = pfp;
    }

    // 2. abas novas ou alteradas
    var catPend = [];
    Object.keys(want.cats).forEach(function (id) {
      var fp = fpOf(want.cats[id]);
      if (srv.cats[id] !== fp) catPend.push([id, fp, owned(want.cats[id])]);
    });
    if (catPend.length) {
      fail(await sb.from("categories").upsert(catPend.map(function (p) { return p[2]; })));
      catPend.forEach(function (p) { srv.cats[p[0]] = p[1]; });
    }

    // 3. tarefas novas ou alteradas
    var taskPend = [];
    Object.keys(want.tasks).forEach(function (id) {
      var fp = fpOf(want.tasks[id]);
      if (srv.tasks[id] !== fp) taskPend.push([id, fp, owned(want.tasks[id])]);
    });
    if (taskPend.length) {
      fail(await sb.from("tasks").upsert(taskPend.map(function (p) { return p[2]; })));
      taskPend.forEach(function (p) { srv.tasks[p[0]] = p[1]; });
    }

    // 4. marcações novas
    var checkNew = Object.keys(want.checks).filter(function (k) { return !srv.checks[k]; });
    if (checkNew.length) {
      fail(await sb.from("task_checks").upsert(checkNew.map(function (k) { return owned(want.checks[k]); })));
      checkNew.forEach(function (k) { srv.checks[k] = 1; });
    }

    // 5. marcações removidas (desmarcar uma tarefa, resetar a semana)
    var checkGone = Object.keys(srv.checks).filter(function (k) { return !want.checks[k]; });
    if (checkGone.length) {
      var res = await Promise.all(checkGone.map(function (k) {
        var p = k.split("|");
        return sb.from("task_checks").delete()
          .eq("task_id", p[0]).eq("week_monday", p[1]).eq("weekday", Number(p[2]));
      }));
      res.forEach(fail);
      checkGone.forEach(function (k) { delete srv.checks[k]; });
    }

    // 6. tarefas removidas
    var taskGone = Object.keys(srv.tasks).filter(function (id) { return !want.tasks[id]; });
    if (taskGone.length) {
      fail(await sb.from("tasks").delete().in("id", taskGone));
      taskGone.forEach(function (id) { delete srv.tasks[id]; });
    }

    // 7. abas removidas, por último — apagar a aba leva junto o que sobrou dela
    var catGone = Object.keys(srv.cats).filter(function (id) { return !want.cats[id]; });
    if (catGone.length) {
      fail(await sb.from("categories").delete().in("id", catGone));
      catGone.forEach(function (id) { delete srv.cats[id]; });
    }
  }

  /* ---------- busca ---------- */

  async function pullOnce() {
    var res = await Promise.all([
      sb.from("profiles").select("display_name,theme").eq("id", currentUser.id).maybeSingle(),
      sb.from("categories").select("id,label,palette,sort_order").order("sort_order", { ascending: true }),
      sb.from("tasks").select("id,category_id,kind,title,note,days,due_date,time_of_day,done,created_at"),
      sb.from("task_checks").select("task_id,week_monday,weekday")
    ]);
    res.forEach(function (r) { if (r.error) throw r.error; });
    return {
      profile: res[0].data || null,
      cats: res[1].data || [],
      tasks: res[2].data || [],
      checks: res[3].data || []
    };
  }

  // Reconstrói o formato que a tela usa a partir das linhas do banco.
  function stateFromServer(d) {
    var st = {
      categories: d.cats.map(function (c) { return { id: c.id, label: c.label, palette: c.palette }; }),
      userName: (d.profile && d.profile.display_name) || "",
      theme: (d.profile && d.profile.theme) || null,
      viewingWeek: (state && state.viewingWeek) || mondayOf(new Date()),
      activeTab: (state && state.activeTab) || OVERVIEW_ID,
      overviewSeen: true,
      seedVersion: SEED_VERSION,
      hardResetVersion: HARD_RESET_VERSION
    };
    st.categories.forEach(function (c) { st[c.id] = { schedule: [], projects: [] }; });

    var porId = {};
    d.tasks.forEach(function (r) {
      if (!st[r.category_id]) return;   // aba que não veio junto: ignora, não quebra
      var nasceu = Date.parse(r.created_at) || Date.now();
      if (r.kind === "schedule") {
        var it = {
          id: r.id, title: r.title || "", note: r.note || "",
          days: (r.days || []).slice(), time: r.time_of_day || "",
          doneMap: {}, createdAt: nasceu
        };
        st[r.category_id].schedule.push(it);
        porId[r.id] = it;
      } else {
        st[r.category_id].projects.push({
          id: r.id, text: r.title || "", date: r.due_date || null,
          time: r.time_of_day || "", done: !!r.done, createdAt: nasceu
        });
      }
    });

    d.checks.forEach(function (r) {
      var it = porId[r.task_id];
      if (!it) return;
      if (!it.doneMap[r.week_monday]) it.doneMap[r.week_monday] = {};
      it.doneMap[r.week_monday][r.weekday] = true;
    });

    st.categories.forEach(function (c) {
      st[c.id].schedule.sort(function (a, b) { return a.createdAt - b.createdAt; });
      st[c.id].projects.sort(function (a, b) { return a.createdAt - b.createdAt; });
    });

    return ensureShape(st);
  }

  /* ---------- busca automática ----------
     Nunca durante uma edição: um render no meio apagaria o que está sendo
     digitado. E nunca com alteração local pendente: ela tem prioridade,
     senão a busca desfaria o que acabou de ser feito. */

  var PULL_EVERY_MS = 60000;
  var PULL_MIN_GAP_MS = 15000;
  var lastPullAt = 0;

  function pullBloqueado() {
    return !currentUser || editingId || formOpen || settingsOpen || localDirty || pushing;
  }

  function maybePull(force) {
    if (pullBloqueado()) return;
    if (document.hidden) return;
    if (!force && Date.now() - lastPullAt < PULL_MIN_GAP_MS) return;
    lastPullAt = Date.now();

    pullOnce().then(function (d) {
      if (!d.cats.length) return;      // conta ainda vazia: nada a trazer
      if (pullBloqueado()) return;     // algo mudou enquanto a busca ia e voltava

      var anterior = state;
      state = stateFromServer(d);
      var want = desiredRows();
      var igual = fpOf(want.profile) === anterior.srv.profile
        && sameFps(want.cats, anterior.srv.cats)
        && sameFps(want.tasks, anterior.srv.tasks)
        && sameFps(want.checks, anterior.srv.checks, true);
      if (igual) { state = anterior; return; }

      markServerClean();
      persistQuiet();
      applyTheme();
      render();
    }).catch(function () {});
  }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) maybePull(true);
  });
  window.addEventListener("focus", function () { maybePull(true); });
  window.setInterval(function () { maybePull(false); }, PULL_EVERY_MS);

  /* =========================================================
     ENTRAR NA CONTA
     ========================================================= */

  var elAuthWrap = document.getElementById("authwrap");
  var elAuthForm = document.getElementById("authForm");
  var elAuthEmail = document.getElementById("authEmail");
  var elAuthPass = document.getElementById("authPass");
  var elAuthMsg = document.getElementById("authMsg");
  var elAuthGo = document.getElementById("authGo");
  var elAuthSwitch = document.getElementById("authSwitch");
  var elAuthSub = document.getElementById("authSub");
  var elPage = document.querySelector(".page");

  var authMode = "signup";

  function authMsg(texto, tipo) {
    if (!texto) { elAuthMsg.hidden = true; return; }
    elAuthMsg.hidden = false;
    elAuthMsg.textContent = texto;
    elAuthMsg.setAttribute("data-kind", tipo || "info");
  }

  function renderAuthMode() {
    var novo = authMode === "signup";
    elAuthGo.textContent = novo ? "Criar conta" : "Entrar";
    elAuthSub.textContent = novo
      ? "Crie sua conta uma vez. Depois é só abrir — o app te mantém dentro."
      : "Entre com a conta que você já criou. Só uma vez em cada aparelho.";
    elAuthSwitch.textContent = novo ? "Já tenho conta — entrar" : "Ainda não tenho conta — criar";
    elAuthPass.setAttribute("autocomplete", novo ? "new-password" : "current-password");
    authMsg("");
  }

  function showAuth() {
    elPage.style.display = "none";
    elAuthWrap.hidden = false;
    renderAuthMode();
    elAuthGo.disabled = false;
  }

  function hideAuth() {
    elAuthWrap.hidden = true;
    elPage.style.display = "";
  }

  elAuthSwitch.addEventListener("click", function () {
    authMode = authMode === "signup" ? "login" : "signup";
    renderAuthMode();
  });

  elAuthForm.addEventListener("submit", function (e) {
    e.preventDefault();
    doAuth();
  });

  async function doAuth() {
    var email = (elAuthEmail.value || "").trim();
    var senha = elAuthPass.value || "";
    if (!email || email.indexOf("@") < 1) {
      authMsg("Digite um e-mail válido.", "erro"); elAuthEmail.focus(); return;
    }
    if (senha.length < 6) {
      authMsg("A senha precisa ter pelo menos 6 caracteres.", "erro"); elAuthPass.focus(); return;
    }

    elAuthGo.disabled = true;
    authMsg(authMode === "signup" ? "Criando sua conta…" : "Entrando…");

    try {
      var r = authMode === "signup"
        ? await sb.auth.signUp({ email: email, password: senha })
        : await sb.auth.signInWithPassword({ email: email, password: senha });
      if (r.error) throw r.error;

      if (!r.data || !r.data.session) {
        // Acontece se a confirmação por e-mail estiver ligada no painel.
        authMode = "login";
        renderAuthMode();
        authMsg("Conta criada. Confirme pelo e-mail e depois entre aqui.", "info");
        elAuthGo.disabled = false;
        return;
      }

      elAuthPass.value = "";
      await startSession(r.data.session.user);
    } catch (err) {
      authMsg(authErrorText(err), "erro");
      elAuthGo.disabled = false;
    }
  }

  function authErrorText(err) {
    var m = ((err && (err.message || err.error_description)) || "").toLowerCase();
    if (m.indexOf("already registered") !== -1 || m.indexOf("already been registered") !== -1)
      return "Esse e-mail já tem conta. Toque em “Já tenho conta — entrar”.";
    if (m.indexOf("invalid login") !== -1 || m.indexOf("invalid credentials") !== -1)
      return "E-mail ou senha não conferem.";
    if (m.indexOf("email not confirmed") !== -1)
      return "Esta conta ainda precisa ser confirmada pelo e-mail.";
    if (m.indexOf("failed to fetch") !== -1 || m.indexOf("networkerror") !== -1)
      return "Sem conexão com o servidor. Verifique a internet e tente de novo.";
    if (m.indexOf("rate limit") !== -1 || m.indexOf("too many") !== -1)
      return "Muitas tentativas seguidas. Espere um minuto e tente de novo.";
    return (err && err.message) ? err.message : "Não deu para concluir. Tente de novo.";
  }

  // Monta o app para uma conta: decide de onde vêm os dados e liga o sincronismo.
  async function startSession(user) {
    currentUser = user;
    STORAGE_KEY = "checklist_u_" + user.id;

    var temLocal = !!localStorage.getItem(STORAGE_KEY);
    state = temLocal ? load() : ensureShape(defaultState());

    var servidor = null;
    try { servidor = await pullOnce(); } catch (e) { servidor = null; }

    // A primeira checagem é por TAREFAS, não por abas, de propósito: uma conta
    // criada num aparelho vazio nasce com as abas padrão e nenhuma tarefa. Se
    // o teste fosse por abas, entrar depois no computador onde as tarefas de
    // verdade estão faria esse servidor "vazio" vencer e elas se perderiam.
    var doAparelho = temLocal ? null : readDeviceState();

    if (servidor && servidor.tasks.length) {
      // A conta já tem conteúdo: o servidor é a verdade.
      state = stateFromServer(servidor);
      markServerClean();
    } else if (doAparelho) {
      // Conta sem tarefas e este navegador tinha um checklist de antes das
      // contas: ele sobe em vez de se perder. É a migração única.
      state = doAparelho;
      markServerEmpty();
    } else if (servidor && servidor.cats.length) {
      // Conta sem tarefas mas com abas já criadas noutro aparelho: aproveita.
      state = stateFromServer(servidor);
      markServerClean();
    } else if (!temLocal) {
      // Conta nova e aparelho sem nada: começa do zero, com as abas padrão.
      state = ensureShape(defaultState());
      markServerEmpty();
    } else {
      // Havia cópia local desta conta, mas o servidor está vazio ou fora do ar.
      markServerEmpty();
    }

    // A limpeza geral (HARD_RESET) é uma ferramenta de desenvolvimento e não
    // pode disparar sozinha sobre dados de uma conta real — só o seed leve,
    // que apenas remove exemplos antigos, continua valendo.
    state.hardResetVersion = HARD_RESET_VERSION;
    seedChanged = applySeedUpdates(state);

    persistQuiet();
    hideAuth();
    applyTheme();
    render();
    if (seedChanged) showToast("Cronograma atualizado.");
    lastPullAt = Date.now();
    if (localDirty) schedulePush();
  }

  async function signOut() {
    try { await sb.auth.signOut(); } catch (e) {}
    // A cópia local sai junto: as tarefas seguem guardadas na conta, mas quem
    // pegar este aparelho depois não deve encontrá-las no navegador.
    try {
      if (STORAGE_KEY) localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(DEVICE_KEY);
      localStorage.removeItem(DEVICE_KEY_LEGACY);
    } catch (e) {}
    currentUser = null;
    STORAGE_KEY = null;
    location.reload();
  }

  /* =========================================================
     BOOT
     ========================================================= */

  // O tema é aplicado antes de qualquer coisa para a tela de entrada já
  // aparecer na aparência certa. Depois do login o tema da conta assume.
  applyTheme();

  // Se já existe sessão guardada neste aparelho, entra direto — é o
  // "cadastre uma vez e nunca mais". Senão, mostra a tela de entrada.
  sb.auth.getSession().then(function (r) {
    var sessao = r && r.data && r.data.session;
    if (sessao && sessao.user) return startSession(sessao.user);
    showAuth();
  }).catch(function () { showAuth(); });

  /* ---- deslizar entre páginas ---- */
  var swipeEl = document.querySelector(".page");
  var tsX = null, tsY = null, tExcluded = false;

  function swipeExcluded(target) {
    return !!(target.closest && (
      target.closest(".cats") ||
      target.closest(".daystrip") ||
      target.closest("input") ||
      target.closest("textarea") ||
      target.closest("[contenteditable]")
    ));
  }

  swipeEl.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { tsX = null; return; }
    tExcluded = swipeExcluded(e.target);
    tsX = e.touches[0].clientX;
    tsY = e.touches[0].clientY;
  }, { passive: true });

  swipeEl.addEventListener("touchend", function (e) {
    if (tsX === null || tExcluded || settingsOpen) { tsX = null; return; }
    var dx = e.changedTouches[0].clientX - tsX;
    var dy = e.changedTouches[0].clientY - tsY;
    tsX = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    var ids = [OVERVIEW_ID].concat(allCatIds());
    var idx = ids.indexOf(state.activeTab);
    var nextIdx = dx < 0 ? idx + 1 : idx - 1;
    if (nextIdx < 0 || nextIdx >= ids.length) return;
    state.activeTab = ids[nextIdx];
    editingId = null;
    formOpen = false;
    draft = null;
    save();
    render();
  }, { passive: true });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
})();
</script>
