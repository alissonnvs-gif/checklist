  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 2.25rem 1.25rem 4rem;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.75rem;
    flex-wrap: wrap;
  }

  h1 {
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 1.95rem;
    font-weight: 600;
    letter-spacing: -0.015em;
    margin: 0;
    text-wrap: balance;
  }

  .today {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
    font-size: 0.8rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  nav.tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
    overflow-x: auto;
    scrollbar-width: none;
  }

  nav.tabs::-webkit-scrollbar { display: none; }

  .tab-btn {
    appearance: none;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    color: var(--text-muted);
    font: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 0.5rem 0.9rem 0.5rem 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .tab-btn .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
  }

  .tab-btn[data-active="true"] {
    color: var(--cat-color, var(--accent));
    border-color: var(--cat-color, var(--accent));
    box-shadow: var(--shadow);
  }

  .tab-btn:hover { color: var(--text); }

  .hero {
    position: relative;
    overflow: hidden;
    border-radius: 22px;
    padding: 1.7rem 1.6rem 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow-md);
    color: #fff;
  }

  .hero::before,
  .hero::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
    pointer-events: none;
  }

  .hero::before {
    width: 240px;
    height: 240px;
    top: -130px;
    right: -55px;
    background: rgba(255, 255, 255, 0.16);
    animation: blob-float 7s ease-in-out infinite;
  }

  .hero::after {
    width: 160px;
    height: 160px;
    bottom: -85px;
    right: 45px;
    background: rgba(255, 255, 255, 0.1);
    animation: blob-float 8s ease-in-out infinite reverse;
  }

  @keyframes blob-float {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-8px, 8px); }
  }

  .hero { margin-bottom: -2.5rem; padding-bottom: 3.5rem; }

  main#content { position: relative; z-index: 2; }

  .hero-title {
    position: relative;
    z-index: 1;
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0;
    text-wrap: balance;
  }

  .hero-sub {
    position: relative;
    z-index: 1;
    font-size: 0.88rem;
    color: rgba(255, 255, 255, 0.88);
    margin-top: 0.3rem;
  }

  .hero-stats {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 0.9rem;
    margin-top: 1.15rem;
  }

  .hero-stats .streak-badge { color: #fff; }
  .hero-stats .progress-count { color: rgba(255, 255, 255, 0.85); }

  .day-strip {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 1.3rem;
  }

  .day-strip-btn {
    appearance: none;
    background: rgba(255, 255, 255, 0.16);
    border: none;
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: grid;
    place-content: center;
    cursor: pointer;
    flex: none;
    font-size: 0.95rem;
  }

  .day-strip-btn:hover { background: rgba(255, 255, 255, 0.28); }

  .day-strip-days {
    display: flex;
    gap: 0.35rem;
    overflow-x: auto;
    flex: 1;
    scrollbar-width: none;
  }

  .day-strip-days::-webkit-scrollbar { display: none; }

  .day-pill {
    appearance: none;
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    background: rgba(255, 255, 255, 0.14);
    border: none;
    border-radius: 12px;
    padding: 0.45rem 0.65rem;
    color: rgba(255, 255, 255, 0.85);
    cursor: pointer;
    min-width: 42px;
    font: inherit;
  }

  .day-pill[data-today="true"] {
    background: #fff;
    color: #1b1e2b;
  }

  .day-pill-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-weight: 700;
  }

  .day-pill-num {
    font-size: 0.9rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .day-pill-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0;
    margin-top: 1px;
  }

  .day-pill[data-complete="true"] .day-pill-dot { opacity: 1; }

  .day-strip-label {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
    margin-top: 1.1rem;
  }

  .day-strip-label .week-tag { color: #fff; }

  .day-strip-today-btn {
    appearance: none;
    background: rgba(255, 255, 255, 0.16);
    border: none;
    color: #fff;
    font: inherit;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    cursor: pointer;
  }

  .tab-btn:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  section.block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    padding: 1.4rem 1.45rem 1.5rem;
    margin-bottom: 1.35rem;
  }

  section.block-summary {
    background: linear-gradient(160deg, color-mix(in srgb, var(--cat-color, var(--accent)) 16%, var(--surface)), color-mix(in srgb, var(--cat-color, var(--accent)) 6%, var(--surface)));
    border-color: color-mix(in srgb, var(--cat-color, var(--accent)) 30%, var(--border));
  }

  .block-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 0.6rem;
  }

  .block-title-group {
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }

  .block-title {
    font-size: 1.08rem;
    font-weight: 700;
  }

  .block-sub {
    font-size: 0.76rem;
    color: var(--text-muted);
  }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .progress-count {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.78rem;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .progress-bar {
    width: 64px;
    height: 5px;
    border-radius: 3px;
    background: var(--surface-2);
    overflow: hidden;
    flex: none;
  }

  .progress-fill {
    height: 100%;
    background: var(--cat-color, var(--accent));
    transition: width 0.2s ease;
  }

  .ring-progress-wrap {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .progress-ring {
    transform: rotate(-90deg);
    flex: none;
  }

  .progress-ring-track {
    stroke: var(--surface-2);
  }

  .progress-ring-fill {
    transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .streak-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.8rem;
    font-weight: 800;
    color: #fff;
    white-space: nowrap;
    background: linear-gradient(135deg, var(--flame), var(--flame-2));
    padding: 0.32rem 0.7rem 0.32rem 0.55rem;
    border-radius: 999px;
    box-shadow: 0 3px 12px -3px color-mix(in srgb, var(--flame-2) 65%, transparent);
    animation: streak-glow 2.4s ease-in-out infinite;
  }

  @keyframes streak-glow {
    0%, 100% { box-shadow: 0 3px 12px -3px color-mix(in srgb, var(--flame-2) 55%, transparent); }
    50% { box-shadow: 0 4px 18px -2px color-mix(in srgb, var(--flame-2) 80%, transparent); }
  }

  .flame-icon { flex: none; }

  .summary-row {
    display: flex;
    gap: 1.25rem;
    margin-top: 0.3rem;
  }

  .summary-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    flex: 1;
  }

  .summary-ring-wrap {
    position: relative;
    width: 64px;
    height: 64px;
  }

  .summary-ring-label {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
    font-weight: 800;
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    color: var(--cat-color, var(--text));
  }

  .summary-caption {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    text-align: center;
  }

  .summary-caption strong { color: var(--text); }

  .reset-btn {
    appearance: none;
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-muted);
    font: inherit;
    font-size: 0.72rem;
    padding: 0.32rem 0.7rem;
    cursor: pointer;
  }

  .reset-btn:hover { color: var(--text); border-color: var(--text-muted); }

  .week-tag {
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--cat-color, var(--accent));
  }

  ul.tasks {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 0.65rem;
    padding: 0.7rem 0.8rem 0.7rem 0.85rem;
    border-radius: 14px;
    border-left: 3px solid var(--task-accent, transparent);
    background: color-mix(in srgb, var(--task-accent, var(--border)) 6%, var(--surface-2));
    box-shadow: 0 1px 2px rgba(20, 24, 43, 0.05);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
  }

  .task:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 14px -5px color-mix(in srgb, var(--task-accent, var(--accent)) 35%, transparent);
  }

  .task[data-done="true"] { opacity: 0.62; }

  .check {
    appearance: none;
    width: 21px;
    height: 21px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex: none;
    cursor: pointer;
    display: grid;
    place-content: center;
    background: var(--surface);
    margin-top: 0.1rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .check::after {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--cat-color, var(--accent)), color-mix(in srgb, var(--cat-color, var(--accent)) 65%, white));
    transform: scale(0);
    transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .check:checked::after { transform: scale(1); }
  .check:checked {
    border-color: var(--cat-color, var(--accent));
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--cat-color, var(--accent)) 18%, transparent);
  }

  .task-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .task-text {
    font-size: 0.96rem;
    font-weight: 700;
    font-style: italic;
    line-height: 1.35;
    word-break: break-word;
  }

  .task-note {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 0.1rem;
    line-height: 1.3;
    word-break: break-word;
  }

  .task[data-done="true"] .task-text {
    color: var(--text-muted);
    text-decoration: line-through;
    text-decoration-color: var(--text-muted);
  }

  .task[data-done="true"] .task-note { opacity: 0.6; }

  .task-actions {
    display: flex;
    gap: 0.15rem;
    flex: none;
  }

  .task-mini-btn {
    appearance: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-muted);
    font-size: 0.7rem;
    font-weight: 700;
    line-height: 1;
    padding: 0.32rem 0.55rem;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.12s ease, background 0.12s ease, border-color 0.12s ease;
  }

  .task-mini-btn.del {
    font-size: 0.85rem;
    padding: 0.32rem 0.5rem;
  }

  .task-mini-btn:hover { color: var(--text); border-color: var(--text-muted); }
  .task-mini-btn.del:hover { color: var(--danger); border-color: var(--danger); }

  .empty {
    font-size: 0.85rem;
    color: var(--text-muted);
    padding: 0.5rem 0.3rem 0.2rem;
    font-style: italic;
  }

  .day-group { margin-bottom: 0.55rem; }
  .day-group:last-of-type { margin-bottom: 0; }

  .day-group[data-today="true"] {
    background: color-mix(in srgb, var(--cat-color, var(--accent)) 12%, var(--surface-2));
    border-radius: 14px;
    padding: 0.5rem 0.6rem 0.6rem;
    margin-left: -0.6rem;
    margin-right: -0.6rem;
    margin-bottom: 0.75rem;
    border: 1px solid color-mix(in srgb, var(--cat-color, var(--accent)) 25%, transparent);
  }

  .day-head {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.055em;
    color: var(--text-muted);
    padding: 0.35rem 0.3rem 0.2rem;
  }

  .day-head[data-today="true"] { color: var(--cat-color, var(--accent)); }

  .today-badge {
    font-size: 0.6rem;
    font-weight: 700;
    background: var(--cat-color, var(--accent));
    color: var(--accent-ink);
    padding: 0.05rem 0.4rem;
    border-radius: 999px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .day-empty {
    font-size: 0.8rem;
    color: var(--text-muted);
    opacity: 0.55;
    font-style: italic;
    padding: 0 0.3rem 0.1rem;
  }

  .task-editing {
    flex-direction: column;
    align-items: stretch;
    background: color-mix(in srgb, var(--cat-color, var(--accent)) 10%, var(--surface-2));
    border-left: 3px solid var(--cat-color, var(--accent));
    padding: 0.75rem 0.85rem;
    border-radius: 14px;
    gap: 0.55rem;
  }

  .edit-field {
    background: transparent;
    border: none;
    border-left: 3px solid var(--cat-color, var(--accent));
    border-bottom: 1.5px solid var(--border);
    border-radius: 0;
    color: var(--text);
    font: inherit;
    font-size: 0.88rem;
    padding: 0.5rem 0.15rem 0.5rem 0.65rem;
    width: 100%;
    transition: border-bottom-color 0.15s ease;
  }

  .edit-field:focus { border-bottom-color: var(--cat-color, var(--accent)); outline: none; }

  .edit-field.note-field {
    background: var(--surface-2);
    border: none;
    border-radius: 10px;
    padding: 0.6rem 0.75rem;
    font-style: italic;
  }

  .edit-field.note-field:focus {
    outline: 2px solid color-mix(in srgb, var(--cat-color, var(--accent)) 45%, transparent);
    outline-offset: 1px;
  }

  .edit-actions {
    display: flex;
    gap: 0.5rem;
  }

  .save-btn {
    appearance: none;

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "checklist_negocios_v3";
  var STORAGE_KEY_LEGACY = "checklist_negocios_v2";

  var CATEGORIES = [
    { id: "blueCrab", label: "Blue Crab", color: "var(--cat-bluecrab)", color2: "var(--cat-bluecrab-2)" },
    { id: "loom", label: "LOOM", color: "var(--cat-loom)", color2: "var(--cat-loom-2)" },
    { id: "loomStore", label: "LOOM Store", color: "var(--cat-loomstore)", color2: "var(--cat-loomstore-2)" },
    { id: "pessoal", label: "Pessoal", color: "var(--cat-pessoal)", color2: "var(--cat-pessoal-2)" }
  ];

  // JS getDay() convention: 0=Dom, 1=Seg, ... 6=Sáb. Displayed Mon→Sun.
  var WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
  var DAY_LABEL = { 0: "Domingo", 1: "Segunda", 2: "Terça", 3: "Quarta", 4: "Quinta", 5: "Sexta", 6: "Sábado" };
  var DAY_SHORT = { 0: "Dom", 1: "Seg", 2: "Ter", 3: "Qua", 4: "Qui", 5: "Sex", 6: "Sáb" };
  var MONTH_SHORT = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

  // Bump SEED_VERSION and edit TASK_SEED to push schedule changes to everyone who
  // already has the app saved locally. Existing items are matched and updated by id
  // (their check-history is preserved); ids not present yet are added. Ids listed in
  // SEED_REMOVE are deleted — keep old ids in that list permanently, since a browser
  // that hasn't opened the app in a while must still catch up correctly.
  // Bump HARD_RESET_VERSION to wipe every category's schedule+projects for
  // anyone who already has the app saved locally, regardless of content —
  // unlike SEED_VERSION this is destructive on purpose, so only bump it when
  // the user explicitly asks to clear everything.
  var HARD_RESET_VERSION = 2;
  var SEED_VERSION = 4;
  var TASK_SEED = {
    blueCrab: [],
    loom: [],
    loomStore: [],
    pessoal: []
  };
  var SEED_REMOVE = [
    "bc-bodylabs-seg", "bc-bodylabs-qua", "bc-bodylabs-sex", "bc-responder",
    "loom-post-ig", "loomstore-estoque", "pessoal-treino"
  ];
  var PROJECT_SEED = {
    blueCrab: [],
    loom: [],
    loomStore: [],
    pessoal: []
  };
  var PROJECT_SEED_REMOVE = ["bc-proj-exemplo", "loomstore-proj-exemplo"];

  function uid() {
    return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function mkScheduleItem(def) {
    return { id: def.id || uid(), title: def.title, note: def.note || "", days: def.days.slice(), doneMap: {}, createdAt: Date.now() };
  }

  function mkProjectTask(def) {
    if (typeof def === "string") def = { text: def };
    var day = (def.day !== undefined && def.day !== null) ? def.day : null;
    return { id: def.id || uid(), text: def.text, day: day, done: false, createdAt: Date.now() };
  }

  function mondayOf(date) {
    var d = new Date(date);
    var day = d.getDay();
    var diff = (day === 0 ? -6 : 1) - day;
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d.toISOString().slice(0, 10);
  }

  function addWeeks(mondayISO, delta) {
    var d = new Date(mondayISO + "T00:00:00");
    d.setDate(d.getDate() + delta * 7);
    return mondayOf(d);
  }

  function formatShort(mondayISO, offsetDays) {
    var d = new Date(mondayISO + "T00:00:00");
    d.setDate(d.getDate() + offsetDays);
    var day = String(d.getDate()).padStart(2, "0");
    return day + " " + MONTH_SHORT[d.getMonth()];
  }

  function defaultState() {
    var s = { activeTab: "blueCrab", viewingWeek: mondayOf(new Date()), seedVersion: SEED_VERSION };
    CATEGORIES.forEach(function (cat) {
      s[cat.id] = {
        schedule: TASK_SEED[cat.id].map(mkScheduleItem),
        projects: PROJECT_SEED[cat.id].map(mkProjectTask)
      };
    });
    return s;
  }

  function migrateFromLegacy(oldParsed) {
    var monday = mondayOf(new Date());
    CATEGORIES.forEach(function (cat) {
      var bucket = oldParsed[cat.id];
      if (!bucket) return;
      (bucket.schedule || []).forEach(function (it) {
        var oldMap = it.doneMap || {};
        var newMap = {};
        newMap[monday] = oldMap;
        it.doneMap = newMap;
      });
    });
    oldParsed.viewingWeek = monday;
    oldParsed.seedVersion = 0;
    return oldParsed;
  }

  function ensureShape(parsed) {
    CATEGORIES.forEach(function (cat) {
      if (!parsed[cat.id]) parsed[cat.id] = { schedule: [], projects: [] };
      var bucket = parsed[cat.id];
      if (!bucket.schedule) bucket.schedule = [];
      if (!bucket.projects) bucket.projects = [];
      bucket.projects.forEach(function (t) { if (t.day === undefined) t.day = null; });
    });
    if (!parsed.viewingWeek) parsed.viewingWeek = mondayOf(new Date());
    if (typeof parsed.seedVersion !== "number") parsed.seedVersion = 0;
    if (typeof parsed.hardResetVersion !== "number") parsed.hardResetVersion = 0;
    if (!parsed.syncMeta) parsed.syncMeta = {};
    if (!parsed.syncKnownIds) parsed.syncKnownIds = [];
    return parsed;
  }

  function applyHardReset(parsed) {
    if (parsed.hardResetVersion >= HARD_RESET_VERSION) return false;
    CATEGORIES.forEach(function (cat) {
      parsed[cat.id] = { schedule: [], projects: [] };
    });
    parsed.hardResetVersion = HARD_RESET_VERSION;
    return true;
  }

  function applySeedUpdates(parsed) {
    if (parsed.seedVersion >= SEED_VERSION) return false;
    CATEGORIES.forEach(function (cat) {
      var bucket = parsed[cat.id];
      TASK_SEED[cat.id].forEach(function (def) {
        var existing = bucket.schedule.filter(function (it) { return it.id === def.id; })[0];
        if (existing) {
          existing.title = def.title;
          existing.note = def.note || "";
          existing.days = def.days.slice();
        } else {
          bucket.schedule.push(mkScheduleItem(def));
        }
      });
      bucket.schedule = bucket.schedule.filter(function (it) { return SEED_REMOVE.indexOf(it.id) === -1; });
      bucket.projects = bucket.projects.filter(function (t) { return PROJECT_SEED_REMOVE.indexOf(t.id) === -1; });
    });
    parsed.seedVersion = SEED_VERSION;
    return true;
  }

  function load() {
    var parsed;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        parsed = JSON.parse(raw);
      } else {
        var rawLegacy = localStorage.getItem(STORAGE_KEY_LEGACY);
        parsed = rawLegacy ? migrateFromLegacy(JSON.parse(rawLegacy)) : defaultState();
      }
    } catch (e) {
      parsed = defaultState();
    }
    return ensureShape(parsed);
  }

  function save(skipSync) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (!skipSync) scheduleSyncPush();
  }

  var state = load();
  var hardReset = applyHardReset(state);
  var seedChanged = applySeedUpdates(state);
  if (hardReset || seedChanged) save(true);

  var pendingDays = { blueCrab: [], loom: [], loomStore: [], pessoal: [] };
  var pendingOnceDay = { blueCrab: [], loom: [], loomStore: [], pessoal: [] };
  var editingId = null;
  var editModeTemp = "recurring";
  var editDaysTemp = [];
  var editOnceDayTemp = [];

  var tabsEl = document.getElementById("tabs");
  var heroEl = document.getElementById("heroContainer");
  var contentEl = document.getElementById("content");
  var todayEl = document.getElementById("today");
  var toastEl = document.getElementById("toast");
  var todayWeekday = new Date().getDay();
  var currentMonday = mondayOf(new Date());

  todayEl.textContent = new Date().toLocaleDateString("pt-BR", {
    weekday: "long", day: "2-digit", month: "long"
  });

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.setAttribute("data-show", "true");
    window.clearTimeout(showToast._t);
    showToast._t = window.setTimeout(function () {
      toastEl.setAttribute("data-show", "false");
    }, 2600);
  }

  function renderTabs() {
    tabsEl.innerHTML = "";
    CATEGORIES.forEach(function (cat) {
      var btn = document.createElement("button");
      btn.className = "tab-btn";
      btn.type = "button";
      btn.setAttribute("data-active", String(cat.id === state.activeTab));
      btn.style.setProperty("--cat-color", cat.color);
      var dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = cat.color;
      btn.appendChild(dot);
      btn.appendChild(document.createTextNode(cat.label));
      btn.addEventListener("click", function () {
        state.activeTab = cat.id;
        editingId = null;
        save();
        render();
      });
      tabsEl.appendChild(btn);
    });
  }

  function buildDayToggles(catColor, selectedArr, single) {
    var wrap = document.createElement("div");
    wrap.className = "day-toggles";
    var buttons = [];
    function refresh() {
      buttons.forEach(function (b) {
        b.setAttribute("data-selected", String(selectedArr.indexOf(b._weekday) !== -1));
      });
    }
    WEEK_ORDER.forEach(function (weekday) {
      var tbtn = document.createElement("button");
      tbtn.type = "button";
      tbtn.className = "day-toggle";
      tbtn.style.setProperty("--cat-color", catColor);
      tbtn.textContent = DAY_SHORT[weekday];
      tbtn._weekday = weekday;
      tbtn.addEventListener("click", function () {
        var idx = selectedArr.indexOf(weekday);
        if (single) {
          selectedArr.length = 0;
          if (idx === -1) selectedArr.push(weekday);
        } else {
          if (idx === -1) selectedArr.push(weekday); else selectedArr.splice(idx, 1);
        }
        refresh();
      });
      buttons.push(tbtn);
      wrap.appendChild(tbtn);
    });
    refresh();
    return wrap;
  }

  function buildProgressRing(pct, color, size, trackColor) {
    size = size || 34;
    var stroke = 3.5;
    var radius = (size - stroke) / 2;
    var circumference = 2 * Math.PI * radius;
    var offset = circumference * (1 - Math.max(0, Math.min(100, pct)) / 100);
    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);
    svg.setAttribute("viewBox", "0 0 " + size + " " + size);
    svg.classList.add("progress-ring");
    var track = document.createElementNS(svgNS, "circle");
    track.setAttribute("cx", size / 2);
    track.setAttribute("cy", size / 2);
    track.setAttribute("r", radius);
    track.setAttribute("fill", "none");
    track.setAttribute("stroke-width", stroke);
    track.classList.add("progress-ring-track");
    if (trackColor) track.style.stroke = trackColor;
    var fillCircle = document.createElementNS(svgNS, "circle");
    fillCircle.setAttribute("cx", size / 2);
    fillCircle.setAttribute("cy", size / 2);
    fillCircle.setAttribute("r", radius);
    fillCircle.setAttribute("fill", "none");
    fillCircle.setAttribute("stroke-width", stroke);
    fillCircle.setAttribute("stroke-linecap", "round");
    fillCircle.setAttribute("stroke-dasharray", circumference);
    fillCircle.setAttribute("stroke-dashoffset", offset);
    fillCircle.style.stroke = color;
    fillCircle.classList.add("progress-ring-fill");
    svg.appendChild(track);
    svg.appendChild(fillCircle);
    return svg;
  }

  function flameIcon(color, size) {
    size = size || 13;
    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("width", size);
    svg.setAttribute("height", size);
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.classList.add("flame-icon");
    var p1 = document.createElementNS(svgNS, "path");
    p1.setAttribute("d", "M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z");
    p1.setAttribute("fill", color);
    var p2 = document.createElementNS(svgNS, "path");
    p2.setAttribute("d", "M9.879 16.121A3 3 0 1012.015 11L11 14H9c0 .768.293 1.536.879 2.121z");
    p2.setAttribute("fill", color);
    p2.style.opacity = "0.55";
    svg.appendChild(p1);
    svg.appendChild(p2);
    return svg;
  }

  function isDayComplete(catId, weekday, monday) {
    var scheduled = state[catId].schedule.filter(function (it) { return it.days.indexOf(weekday) !== -1; });
    var once = (monday === currentMonday) ? state[catId].projects.filter(function (t) { return t.day === weekday; }) : [];
    var all = scheduled.concat(once);
    if (all.length === 0) return false;
    return all.every(function (it) {
      if (it.doneMap) return !!((it.doneMap[monday] || {})[weekday]);
      return !!it.done;
    });
  }

  function computeStreak(catId) {
    var streak = 0;
    var cursor = new Date();
    cursor.setHours(0, 0, 0, 0);
    var todayTime = cursor.getTime();
    for (var i = 0; i < 400; i++) {
      var weekday = cursor.getDay();
      var monday = mondayOf(cursor);
      var scheduled = state[catId].schedule.filter(function (it) { return it.days.indexOf(weekday) !== -1; });
      var once = (monday === currentMonday) ? state[catId].projects.filter(function (t) { return t.day === weekday; }) : [];
      var hasTasks = scheduled.length + once.length > 0;
      if (!hasTasks) {
        cursor.setDate(cursor.getDate() - 1);
        continue;
      }
      var complete = isDayComplete(catId, weekday, monday);
      if (complete) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      } else if (cursor.getTime() === todayTime) {
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function heroBlock(cat) {
    var hero = document.createElement("section");
    hero.className = "hero";
    hero.style.background = "linear-gradient(135deg, " + cat.color + ", " + cat.color2 + ")";

    var hour = new Date().getHours();
    var greeting = hour < 5 ? "Boa noite" : hour < 12 ? "Bom dia" : hour < 18 ? "Boa tarde" : "Boa noite";

    var title = document.createElement("h2");
    title.className = "hero-title";
    title.textContent = greeting + ".";
    hero.appendChild(title);

    var todayScheduled = state[cat.id].schedule.filter(function (it) { return it.days.indexOf(todayWeekday) !== -1; });
    var todayOnce = state[cat.id].projects.filter(function (t) { return t.day === todayWeekday; });
    var todayDone = 0;
    todayScheduled.forEach(function (it) {
      var wm = it.doneMap[currentMonday] || {};
      if (wm[todayWeekday]) todayDone++;
    });
    todayOnce.forEach(function (t) { if (t.done) todayDone++; });
    var todayTotal = todayScheduled.length + todayOnce.length;
    var todayRemaining = todayTotal - todayDone;

    var sub = document.createElement("div");
    sub.className = "hero-sub";
    if (todayTotal === 0) sub.textContent = "Nada agendado pra hoje.";
    else if (todayRemaining === 0) sub.textContent = "Hoje está completo.";
    else sub.textContent = todayRemaining === 1 ? "Falta 1 tarefa pra hoje." : "Faltam " + todayRemaining + " tarefas pra hoje.";
    hero.appendChild(sub);

    var items = state[cat.id].schedule;
    var projectsBucket = state[cat.id].projects;
    var isCurrentWeek = state.viewingWeek === currentMonday;
    var onceWithDay = isCurrentWeek ? projectsBucket.filter(function (t) { return t.day !== undefined && t.day !== null; }) : [];
    var total = 0, done = 0;
    items.forEach(function (it) {
      var wm = it.doneMap[state.viewingWeek] || {};
      it.days.forEach(function (d) {
        total++;
        if (wm[d]) done++;
      });
    });
    onceWithDay.forEach(function (t) {
      total++;
      if (t.done) done++;
    });
    var pct = total ? Math.round((done / total) * 100) : 0;

    var stats = document.createElement("div");
    stats.className = "hero-stats";
    var streak = computeStreak(cat.id);
    if (streak > 0) {
      var streakBadge = document.createElement("span");

      group.appendChild(dh);

      var visibleCount = 0;
      var list = document.createElement("ul");
      list.className = "tasks";

      dayItems.forEach(function (it) {
        if (it.id === editingId) {
          var primaryDay = WEEK_ORDER.filter(function (d) { return it.days.indexOf(d) !== -1; })[0];
          if (primaryDay === weekday) {
            list.appendChild(editItemForm(cat, it, "schedule"));
            visibleCount++;
          }
          return;
        }
        list.appendChild(scheduleItemRow(catId, catColor, items, it, weekday));
        visibleCount++;
      });

      dayOnceItems.forEach(function (t) {
        if (t.id === editingId) {
          list.appendChild(editItemForm(cat, t, "project"));
        } else {
          list.appendChild(onceItemRow(catId, catColor, projectsBucket, t));
        }
        visibleCount++;
      });

      if (visibleCount === 0) {
        var de = document.createElement("div");
        de.className = "day-empty";
        de.textContent = "Nada agendado";
        group.appendChild(de);
      } else {
        group.appendChild(list);
      }

      block.appendChild(group);
    });

    return block;
  }

  function summaryBlock(catId, catColor) {
    var items = state[catId].schedule;
    var projectsBucket = state[catId].projects;
    var isCurrentWeek = state.viewingWeek === currentMonday;
    var onceWithDay = isCurrentWeek ? projectsBucket.filter(function (t) { return t.day !== undefined && t.day !== null; }) : [];
    var cronoTotal = 0, cronoDone = 0;
    items.forEach(function (it) {
      var wm = it.doneMap[state.viewingWeek] || {};
      it.days.forEach(function (d) {
        cronoTotal++;
        if (wm[d]) cronoDone++;
      });
    });
    onceWithDay.forEach(function (t) {
      cronoTotal++;
      if (t.done) cronoDone++;
    });
    var cronoPct = cronoTotal ? Math.round((cronoDone / cronoTotal) * 100) : 0;

    var resolverBucket = projectsBucket.filter(function (t) { return t.day === undefined || t.day === null; });
    var resolverDone = resolverBucket.filter(function (t) { return t.done; }).length;
    var resolverTotal = resolverBucket.length;
    var resolverPct = resolverTotal ? Math.round((resolverDone / resolverTotal) * 100) : 0;

    var block = document.createElement("section");
    block.className = "block block-summary";
    block.style.setProperty("--cat-color", catColor);

    var head = document.createElement("div");
    head.className = "block-head";
    var titleGroup = document.createElement("div");
    titleGroup.className = "block-title-group";
    var titleEl = document.createElement("div");
    titleEl.className = "block-title";
    titleEl.textContent = "Resumo";
    var subEl = document.createElement("div");
    subEl.className = "block-sub";
    subEl.textContent = "Como está essa semana";
    titleGroup.appendChild(titleEl);
    titleGroup.appendChild(subEl);
    head.appendChild(titleGroup);
    block.appendChild(head);

    var row = document.createElement("div");
    row.className = "summary-row";
    row.appendChild(summaryRingItem(catColor, cronoPct, cronoDone + "/" + cronoTotal, "no cronograma"));
    row.appendChild(summaryRingItem(catColor, resolverPct, resolverDone + "/" + resolverTotal, "em resolver"));
    block.appendChild(row);

    return block;
  }

  function resolverBlock(catId, catColor) {
    var cat = { id: catId, color: catColor };
    var bucket = state[catId].projects.filter(function (t) { return t.day === undefined || t.day === null; });
    var done = bucket.filter(function (t) { return t.done; }).length;
    var total = bucket.length;
    var pct = total ? Math.round((done / total) * 100) : 0;

    var block = document.createElement("section");
    block.className = "block";

    var head = document.createElement("div");
    head.className = "block-head";

    var titleGroup = document.createElement("div");
    titleGroup.className = "block-title-group";
    var titleEl = document.createElement("div");
    titleEl.className = "block-title";
    titleEl.textContent = "Resolver";
    var subEl = document.createElement("div");
    subEl.className = "block-sub";
    subEl.textContent = "Sem data — resolva quando puder";
    titleGroup.appendChild(titleEl);
    titleGroup.appendChild(subEl);

    var right = document.createElement("div");
    right.className = "progress-wrap";
    var count = document.createElement("span");
    count.className = "progress-count";
    count.textContent = done + "/" + total;
    var bar = document.createElement("div");
    bar.className = "progress-bar";
    var fill = document.createElement("div");
    fill.className = "progress-fill";
    fill.style.setProperty("--cat-color", catColor);
    fill.style.width = pct + "%";
    bar.appendChild(fill);
    right.appendChild(count);
    right.appendChild(bar);

    head.appendChild(titleGroup);
    head.appendChild(right);
    block.appendChild(head);

    var list = document.createElement("ul");
    list.className = "tasks";

    if (bucket.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Nenhuma tarefa ainda — adicione abaixo.";
      list.appendChild(empty);
    }

    bucket.forEach(function (task) {
      if (task.id === editingId) {
        list.appendChild(editItemForm(cat, task, "project"));
        return;
      }

      var li = document.createElement("li");
      li.className = "task";
      li.style.setProperty("--task-accent", catColor);
      li.setAttribute("data-done", String(task.done));

      var check = document.createElement("input");
      check.type = "checkbox";
      check.className = "check";
      check.checked = task.done;
      check.style.setProperty("--cat-color", catColor);
      check.addEventListener("change", function () {
        task.done = check.checked;
        save();
        render();
      });

      var main = document.createElement("div");
      main.className = "task-main";
      var text = document.createElement("span");
      text.className = "task-text";
      text.textContent = task.text;
      main.appendChild(text);
      if (task.day !== undefined && task.day !== null) {
        var dayBadge = document.createElement("span");
        dayBadge.className = "task-day-badge";
        dayBadge.textContent = DAY_SHORT[task.day];
        main.appendChild(dayBadge);
      }

      var actions = document.createElement("div");
      actions.className = "task-actions";

      var editBtn = document.createElement("button");
      editBtn.className = "task-mini-btn";
      editBtn.type = "button";
      editBtn.textContent = "Editar";
      editBtn.addEventListener("click", function () {
        editingId = task.id;
        editModeTemp = "once";
        editDaysTemp = [];
        editOnceDayTemp = (task.day !== undefined && task.day !== null) ? [task.day] : [];
        render();
      });

      var del = document.createElement("button");
      del.className = "task-mini-btn del";
      del.type = "button";
      del.setAttribute("aria-label", "Remover tarefa");
      del.textContent = "×";
      del.addEventListener("click", function () {
        var idx = state[catId].projects.indexOf(task);
        if (idx >= 0) state[catId].projects.splice(idx, 1);
        save();
        render();
      });

      actions.appendChild(editBtn);
      actions.appendChild(del);

      li.appendChild(check);
      li.appendChild(main);
      li.appendChild(actions);
      list.appendChild(li);
    });

    block.appendChild(list);

    var addRow = document.createElement("div");
    addRow.className = "add-row inline";
    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Algo pra resolver…";
    input.style.setProperty("--cat-color", catColor);
    var addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "submit";
    addBtn.textContent = "Adicionar";
    addBtn.style.setProperty("--cat-color", catColor);

    function commit() {
      var val = input.value.trim();
      if (!val) return;
      state[catId].projects.push(mkProjectTask({ text: val, day: null }));
      input.value = "";
      save();
      render();
    }

    addBtn.addEventListener("click", commit);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") commit();
    });

    addRow.appendChild(input);
    addRow.appendChild(addBtn);
    block.appendChild(addRow);

    return block;
  }

  // ---- Notion sync (via the checklist-sync proxy) ----
  // Only the schedule DEFINITION (title/note/category/days) and the "done"
  // flag on one-off (Resolver) tasks are synced. The per-week doneMap
  // history for recurring Cronograma tasks is never read or written here —
  // it stays local-only, exactly as before this feature existed.
  var SYNC_API_BASE = "https://checklist-sync-eta.vercel.app";
  var SYNC_APP_KEY = "092c4172262678f0a600ba069d3026d0157e449f";
  var CATEGORY_VALID = { blueCrab: 1, loom: 1, loomStore: 1, pessoal: 1 };
  var syncPushTimer = null;

  function taskToSyncPayload(catId, kind, item) {
    return {
      appId: item.id,
      notionPageId: item.notionPageId || undefined,
      category: catId,
      kind: kind,
      title: kind === "schedule" ? item.title : item.text,
      note: kind === "schedule" ? (item.note || "") : "",
      days: kind === "schedule" ? item.days.slice() : ((item.day !== undefined && item.day !== null) ? [item.day] : []),
      done: kind === "once" ? !!item.done : false,
      archived: false
    };
  }

  function syncFingerprint(payload) {
    return JSON.stringify([payload.category, payload.kind, payload.title, payload.note, payload.days.slice().sort(), payload.done]);
  }

  function collectAllSyncableItems() {
    var out = [];
    CATEGORIES.forEach(function (cat) {
      state[cat.id].schedule.forEach(function (it) { out.push({ catId: cat.id, kind: "schedule", item: it }); });
      state[cat.id].projects.forEach(function (it) { out.push({ catId: cat.id, kind: "once", item: it }); });
    });
    return out;
  }

  function pushOneToNotion(item, payload, fp) {
    fetch(SYNC_API_BASE + "/api/schedule", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-App-Key": SYNC_APP_KEY },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.ok ? r.json() : Promise.reject(r); })
      .then(function (data) {
        item.notionPageId = data.task.notionPageId;
        state.syncMeta[item.id] = { fp: fp, notionPageId: data.task.notionPageId, remoteUpdatedAt: data.task.updatedAt };
        save(true);
      })
      .catch(function () {});
  }

  function runSyncPush() {
    var all = collectAllSyncableItems();
    var currentIds = {};
    all.forEach(function (entry) {
      currentIds[entry.item.id] = true;
      var payload = taskToSyncPayload(entry.catId, entry.kind, entry.item);
      var fp = syncFingerprint(payload);
      var meta = state.syncMeta[entry.item.id];
      if (meta && meta.fp === fp) return;
      pushOneToNotion(entry.item, payload, fp);
    });

    state.syncKnownIds.filter(function (id) { return !currentIds[id]; }).forEach(function (id) {
      var meta = state.syncMeta[id];
      fetch(SYNC_API_BASE + "/api/schedule/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-App-Key": SYNC_APP_KEY },
        body: JSON.stringify({ appId: id, notionPageId: meta && meta.notionPageId })
      }).catch(function () {});
      delete state.syncMeta[id];
    });
    state.syncKnownIds = Object.keys(currentIds);
    save(true);
  }

  function scheduleSyncPush() {
    if (!SYNC_API_BASE) return;
    window.clearTimeout(syncPushTimer);
    syncPushTimer = window.setTimeout(runSyncPush, 800);
  }

  function findLocalSyncItem(id) {
    for (var i = 0; i < CATEGORIES.length; i++) {
      var cat = CATEGORIES[i];
      var s = state[cat.id].schedule.filter(function (it) { return it.id === id; })[0];
      if (s) return { catId: cat.id, kind: "schedule", item: s };
      var p = state[cat.id].projects.filter(function (it) { return it.id === id; })[0];
      if (p) return { catId: cat.id, kind: "once", item: p };
    }
    return null;
  }

  function applyRemoteTask(remote) {
    if (!remote.category || !CATEGORY_VALID[remote.category]) return false;
    var appId = remote.appId;
    var local = appId ? findLocalSyncItem(appId) : null;

    if (!local) {
      var newId = appId || uid();
      var bucket = state[remote.category];
      var newItem;
      if (remote.kind === "once") {
        newItem = { id: newId, text: remote.title, day: (remote.days && remote.days[0] !== undefined) ? remote.days[0] : null, done: !!remote.done, createdAt: Date.now(), notionPageId: remote.notionPageId };
        bucket.projects.push(newItem);
      } else {
        newItem = { id: newId, title: remote.title, note: remote.note || "", days: (remote.days || []).slice(), doneMap: {}, createdAt: Date.now(), notionPageId: remote.notionPageId };
        bucket.schedule.push(newItem);
      }
      var fp = syncFingerprint(taskToSyncPayload(remote.category, remote.kind, newItem));
      state.syncMeta[newId] = { fp: fp, notionPageId: remote.notionPageId, remoteUpdatedAt: remote.updatedAt };
      if (state.syncKnownIds.indexOf(newId) === -1) state.syncKnownIds.push(newId);
      if (!appId) scheduleSyncPush();
      return true;
    }

    var meta = state.syncMeta[local.item.id];
    if (meta && meta.remoteUpdatedAt === remote.updatedAt) return false;
    if (local.kind !== remote.kind || local.catId !== remote.category) return false;

    if (remote.kind === "once") {
      local.item.text = remote.title;
      local.item.day = (remote.days && remote.days[0] !== undefined) ? remote.days[0] : null;
      local.item.done = !!remote.done;
    } else {
      local.item.title = remote.title;
      local.item.note = remote.note || "";
      local.item.days = (remote.days || []).slice();
    }
    local.item.notionPageId = remote.notionPageId;
    var fp2 = syncFingerprint(taskToSyncPayload(local.catId, local.kind, local.item));
    state.syncMeta[local.item.id] = { fp: fp2, notionPageId: remote.notionPageId, remoteUpdatedAt: remote.updatedAt };
    return true;
  }

  function syncPull() {
    if (!SYNC_API_BASE) return;
    fetch(SYNC_API_BASE + "/api/schedule", { headers: { "X-App-Key": SYNC_APP_KEY } })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r); })
      .then(function (data) {
        var changed = false;
        (data.tasks || []).forEach(function (remote) {
          if (applyRemoteTask(remote)) changed = true;
        });
        if (changed) { save(true); render(); }
      })
      .catch(function () {});
  }

  function render() {
    renderTabs();
    var cat = CATEGORIES.filter(function (c) { return c.id === state.activeTab; })[0];
    heroEl.innerHTML = "";
    heroEl.appendChild(heroBlock(cat));
    contentEl.innerHTML = "";
    contentEl.appendChild(newTaskBlock(cat));
    contentEl.appendChild(scheduleBlock(cat.id, cat.color));
    contentEl.appendChild(resolverBlock(cat.id, cat.color));
    contentEl.appendChild(summaryBlock(cat.id, cat.color));
  }

  render();
  if (hardReset) showToast("Tudo limpo — comece do zero.");
  else if (seedChanged) showToast("Cronograma atualizado.");
  syncPull();

  var swipeContainer = document.querySelector(".page");
  var touchStartX = null;
  var touchStartY = null;
  var touchExcluded = false;

  function isSwipeExcluded(target) {
    return !!(target.closest && (
      target.closest(".day-strip-days") ||
      target.closest("nav.tabs") ||
      target.closest("input") ||
      target.closest("textarea")
    ));
  }

  swipeContainer.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { touchStartX = null; return; }
    touchExcluded = isSwipeExcluded(e.target);
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  swipeContainer.addEventListener("touchend", function (e) {
    if (touchStartX === null || touchExcluded) { touchStartX = null; return; }
    var endX = e.changedTouches[0].clientX;
    var endY = e.changedTouches[0].clientY;
    var dx = endX - touchStartX;
    var dy = endY - touchStartY;
    touchStartX = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    var ids = CATEGORIES.map(function (c) { return c.id; });
    var idx = ids.indexOf(state.activeTab);
    var nextIdx = dx < 0 ? idx + 1 : idx - 1;
    if (nextIdx < 0 || nextIdx >= CATEGORIES.length) return;
    state.activeTab = CATEGORIES[nextIdx].id;
    editingId = null;
    save();
    render();
  }, { passive: true });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
})();
</script>
